site_name: webDMX Wiki
site_url: https://wiki.webdmx.com

theme:
  name: material
  language: custom
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/favicon.png

  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Light mode

    - media: "(prefers-color-scheme: light)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Dark mode

extra:
  alternate:
    - name: English
      link: /en/
      lang: en

    - name: Deutsch
      link: /de/
      lang: de

  homepage: https://webdmx.com

plugins:
  - search:
      lang:
        - en
        - de

  - i18n:
      docs_structure: folder
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true

        - locale: de
          name: Deutsch
          build: true
